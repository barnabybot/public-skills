# Model IDs, provider settings and evidence. Edit model preferences in ../SKILL.md.
#
# ---------------------------------------------------------------------------
# THIS IS A PLACEHOLDER TABLE. Replace it with your own stack before you spawn.
#
# `provider_b` ships with obviously fake model IDs so a wrong model can never
# launch silently. `provider_a` ships with real Claude IDs, so a Claude-only
# reader can run `--tier <category>` today and edit the rest later.
#
# Three rules the resolver enforces, so you cannot get them wrong quietly:
#   1. Every category in this file must appear in the SKILL.md table, and the other
#      way round.
#   2. Every category's backup must sit on a DIFFERENT provider from its default.
#      A backup on the same provider fails at the moment you need it, which is
#      when that provider's allowance runs out.
#   3. Every effort named in the table must be in that provider's `efforts`.
#
# `codexbar: null` on both providers means capacity reads as unread and each
# row dispatches as written. Wire a usage meter in by setting `codexbar` to the
# provider name your meter reports, and the same resolver starts taking the
# backup when the default is exhausted. Nothing else changes.
# ---------------------------------------------------------------------------
version: 3
revised: 2026-10-03
revised_by: "placeholder table shipped with the public skill"
evidence_date: none
evidence_digest: "No evidence. Every row below is a shape to edit."
providers:
  provider_a:
    agent: claude
    codexbar: null
    subscription: "(your plan)"
    efforts:
    - low
    - medium
    - high
    - xhigh
    - max
  provider_b:
    agent: codex
    codexbar: null
    subscription: "(your plan)"
    efforts:
    - low
    - medium
    - high
    - xhigh
    - max
models:
  a_large:
    id: claude-opus-5-5
    aa_release: claude-opus-5-5
    provider: provider_a
    display: A-Large
  a_mid:
    id: claude-sonnet-5-5
    aa_release: claude-sonnet-5-5
    provider: provider_a
    display: A-Mid
  a_small:
    id: claude-haiku-4-5-20251001
    aa_release: claude-4-5-haiku
    provider: provider_a
    display: A-Small
  b_large:
    id: REPLACE-WITH-YOUR-PROVIDER-B-LARGE-MODEL-ID
    # aa_release: <the model's release slug on artificialanalysis.ai>
    provider: provider_b
    display: B-Large
  b_mid:
    id: REPLACE-WITH-YOUR-PROVIDER-B-MID-MODEL-ID
    # aa_release: <the model's release slug on artificialanalysis.ai>
    provider: provider_b
    display: B-Mid
# scripts/aa_refresh.py ranks every model that carries `aa_release`. A model
# without one is left out of the ranking; a category with no ranked model
# reports "none". `aa_exclude: [<class>]` on a model keeps it out of one class.
aa:
  # Any AA model page embeds every model record; aa_refresh.py reads it.
  source: https://artificialanalysis.ai/models/claude-opus-5-5
  # US$ of AA cost per Intelligence Index task that one extra point of the
  # category measure may cost before the knee stops stepping up.
  cost_per_point:
    presented: 0.75
    build: 0.5
    volume: 0.1
    mechanical: 0.02
  categories:
    finance:
      measure: [capabilities.financeAndAccounting]
      class: presented
    strategy:
      measure: [capabilities.strategyAndOps, capabilities.economics]
      class: presented
    legal:
      measure: [capabilities.legal]
      class: presented
    coding:
      measure: [terminalBench40]
      class: build
    systems:
      measure: [terminalBench40]
      class: build
    classification:
      measure: [intelligenceIndex]
      class: volume
    housekeeping:
      measure: [intelligenceIndex]
      class: mechanical
capacity:
  exhausted_used_percent: 95
  exhausted_min_hours_to_reset: 1
  read_timeout_seconds: 20
  timezone: UTC
tiers:
  finance:
    name: Finance & accounting
    what: Build or check a financial model, databook, reconciliation, valuation or tax
      calculation
    stop: Figures tie to source. Max for the final look.
    basis: practice
    evidence: placeholder
  strategy:
    name: Strategy & economics
    what: Write a plan, proposal, market sizing, competitor view, unit economics or
      investment thesis
    stop: An argument you would present. Max for the final look.
    basis: practice
    evidence: placeholder
  legal:
    name: Legal
    what: Read or mark up a contract, terms of business or regulation
    stop: Every clause named with its issue. Max for the final look.
    basis: practice
    evidence: placeholder
  writing:
    name: Writing
    what: Draft or edit prose you present, including memos, essays, posts, speaker
      notes and fiction
    stop: Prose you would publish. Max for the final look.
    basis: practice
    evidence: placeholder
  visual:
    name: Visual
    what: Make or fix how something looks, such as a deck, slide, chart, page or image
    stop: Screenshots at 1920x1080 plus one phone viewport. The backup is the visual
      QA gate.
    basis: practice
    evidence: placeholder
  coding:
    name: Coding
    what: Build or change software, such as a skill, script, site code or scheduled
      job
    stop: It runs, and tests or a validator pass.
    basis: practice
    evidence: placeholder
  systems:
    name: Systems debugging
    what: Find why a machine, server or tool failed
    stop: Cause named and demonstrated.
    basis: practice
    evidence: placeholder
  classification:
    name: Classification
    what: Read each note and decide its properties, categories or links
    stop: Every note labelled; a sample checked against the user's labels.
    basis: practice
    evidence: placeholder
  housekeeping:
    name: Housekeeping
    what: Apply listed changes with no judgement, such as rename, move or given edits
    stop: The named files only.
    basis: practice
    evidence: placeholder
  orchestrator:
    name: Orchestrator
    what: 'This seat: dispatch, relay, judgement, succession'
    stop: A seat that compacts in place recycles on a new phase; a seat with a fixed
      window hands off at about 30%.
    basis: practice
    evidence: placeholder
  review:
    name: Review
    what: Independent check of finished work; takes the category of the work it checks,
      on a different provider
    of: required
    stop: Every finding with confidence and severity, plus a coverage statement.
    basis: practice
    evidence: Never the builder's provider.
legacy_tiers:
  O: orchestrator
  A: housekeeping
  B: coding
  C: coding
  D: visual
  E: systems
  F: writing
  V: visual
  R: review
  basic: housekeeping
  moderate: coding
  complex: systems
