<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Intelligence · Automation Roadmap</title>
<style>
__FONTS__
:root{
  --paper:#fffff8;
  --surface:#ffffff;
  --paper-2:#f2f2ef;
  --ink:#1a1a1a;
  --ink-strong:#000000;
  --muted:#5e6268;
  --soft:#6b6b6b;
  --rule:rgba(26,26,26,.11);
  --rule-strong:#dcd9d1;
  --accent:#c82118;
  --accent-mark:#e8483f;
  --accent-mid:#f1a49e;
  --accent-tint:#fdeeed;
  --slate:#3e4e54;
  --slate-mid:#7d8a90;
  --slate-pale:#edf0f1;
  --slate-ink:#3e4e54;
  --paper-on-slate:#f2f2ef;
  --muted-on-slate:#d9dee0;
  --series-muted:#d4d3cd;
  --weekend-tint:rgba(62,78,84,.055);
  --good:#3e4e54;
  --good-pale:#edf0f1;
  --shadow-drawer:0 12px 42px rgba(0,0,0,.14);
  --shadow-tip:0 6px 20px rgba(0,0,0,.16);
  --tip-border:rgba(255,255,255,.12);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --font-serif:"ET Book","et-book",Palatino,"Palatino Linotype",Georgia,serif;
  --font-sans:"Meta Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --paper:#121212;
  --surface:#1a1a1a;
  --paper-2:#222222;
  --ink:#ededed;
  --ink-strong:#ffffff;
  --muted:#a3a6ac;
  --soft:#8a8d93;
  --rule:rgba(237,237,237,.12);
  --rule-strong:rgba(237,237,237,.24);
  --accent:#f1a49e;
  --accent-mark:#e8483f;
  --accent-mid:#f1a49e;
  --accent-tint:rgba(241,164,158,.14);
  --slate:#8fa3ab;
  --slate-mid:#637278;
  --slate-pale:rgba(143,163,171,.14);
  --slate-ink:#d9dee0;
  --paper-on-slate:#f2f2ef;
  --muted-on-slate:#d9dee0;
  --series-muted:#3d4044;
  --weekend-tint:rgba(255,255,255,.04);
  --good:#a3b5bc;
  --good-pale:rgba(143,163,171,.14);
  --shadow-drawer:0 12px 48px rgba(0,0,0,.55);
  --shadow-tip:0 8px 24px rgba(0,0,0,.45);
  --tip-border:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;scrollbar-color:var(--rule-strong) transparent;scrollbar-width:thin}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--font-sans);transition:background 180ms ease,color 180ms ease}
::selection{background:var(--accent-tint);color:var(--ink-strong)}
a{color:var(--ink-strong);text-decoration:underline;text-decoration-color:var(--rule-strong);text-underline-offset:.2em;cursor:pointer;transition:color 140ms ease,text-decoration-color 140ms ease}
a:hover{color:var(--accent);text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
code{font-family:var(--font-mono);font-size:12.5px;background:var(--paper-2);padding:2px 6px;border-radius:4px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

.masthead{border-bottom:1px solid var(--rule);background:var(--paper);position:sticky;top:0;z-index:20}
.masthead-inner{max-width:1120px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--ink-strong);text-decoration:none}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-mark);flex:none}
.chapters{display:flex;align-items:center;gap:4px;background:var(--paper-2);padding:3px;border-radius:7px;border:1px solid var(--rule)}
.chapters a{text-decoration:none;font-size:13px;font-weight:500;padding:5px 12px;border-radius:5px;color:var(--muted);transition:background 150ms ease,color 150ms ease}
.chapters a.active{background:var(--surface);color:var(--ink-strong);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chapters a:hover:not(.active){color:var(--ink-strong)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--rule-strong);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;transition:border-color 150ms ease,color 150ms ease}
.theme-btn:hover{border-color:var(--ink);color:var(--ink-strong)}
.theme-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.shell{max-width:1120px;margin:0 auto;padding:32px 28px 88px}
@media(max-width:600px){.masthead-inner,.shell,.foot{padding-left:18px;padding-right:18px}.shell{padding-top:24px}}
.hero{padding-bottom:18px;border-bottom:1px solid var(--rule)}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap}
.hero h1{margin:0;font-family:var(--font-serif);font-weight:400;font-size:38px;line-height:1.12;letter-spacing:-.015em;color:var(--ink-strong);text-wrap:balance}
@media(max-width:600px){.hero h1{font-size:30px}}
.period-bar{display:inline-flex;align-items:center;gap:3px;background:var(--paper-2);padding:3px;border-radius:7px;border:1px solid var(--rule);flex:none}
.period-bar button{background:transparent;border:none;padding:5px 11px;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);cursor:pointer;transition:background 140ms ease,color 140ms ease}
.period-bar button:hover:not(.on){color:var(--ink-strong)}
.period-bar button.on{background:var(--surface);color:var(--ink-strong);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.hero-meta{margin-top:10px;font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.hero-meta .mono{font-family:var(--font-mono);font-size:12px;color:var(--soft)}
.scope-note{font-family:var(--font-mono);font-size:11px;color:var(--slate-ink);background:var(--slate-pale);padding:2px 8px;border-radius:4px;white-space:nowrap}

.tabs-wrap{position:relative;margin-top:18px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:11px 2px 10px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color 150ms ease,border-color 150ms ease;flex:none}
.tabs button:hover{color:var(--ink-strong)}
.tabs button.on{color:var(--ink-strong);border-bottom-color:var(--accent);font-weight:700}
.tabs button .cnt{font-family:var(--font-mono);font-size:11.5px;color:var(--soft);margin-left:5px;font-weight:400}

main{padding-top:26px}

.ledger{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);margin-bottom:24px;background:var(--surface)}
@media(max-width:860px){.ledger{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.ledger{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:15px 16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kpi:nth-child(6n){border-right:none}
@media(min-width:861px){.kpi{border-bottom:none}}
@media(max-width:860px) and (min-width:521px){.kpi:nth-child(3n){border-right:none}.kpi:nth-child(n+4){border-bottom:none}}
@media(max-width:520px){.kpi:nth-child(2n){border-right:none}.kpi:nth-child(n+5){border-bottom:none}}
.kpi .val{font-family:var(--font-mono);font-size:23px;font-weight:400;letter-spacing:-.02em;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:3px}
.kpi .sub{font-family:var(--font-mono);font-size:10.5px;color:var(--soft);margin-top:2px}

.lever{background:var(--surface);border:1px solid var(--rule-strong);border-radius:8px;padding:18px 22px;margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap}
.lever-body{flex:1;min-width:250px}
.lever-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lever-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-tint);padding:3px 8px;border-radius:4px}
.lever-text{font-family:var(--font-serif);font-size:20px;line-height:1.4;color:var(--ink-strong);margin:0;max-width:68ch}
.lever-cta{align-self:center;background:none;border:1px solid var(--rule-strong);border-radius:6px;padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink-strong);cursor:pointer;white-space:nowrap;transition:border-color 150ms ease,color 150ms ease}
.lever-cta:hover{border-color:var(--accent);color:var(--accent)}

.summary-band{margin-bottom:26px;max-width:72ch}
.summary-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.summary-band h2{margin:0;font-family:var(--font-serif);font-weight:400;font-size:22px;color:var(--ink-strong)}
.summary-band p{margin:0;font-size:15px;line-height:1.64;color:var(--ink)}

.fig{margin:0;padding:22px 0 26px;border-top:1px solid var(--rule)}
.fig-head{margin-bottom:14px}
.fig-claim{margin:0;font-size:16px;font-weight:700;line-height:1.32;color:var(--ink-strong);letter-spacing:-.01em}
.fig-sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.fig-note{margin:10px 0 0;font-size:11.5px;color:var(--soft);line-height:1.45}
.chart-slot{width:100%;min-height:40px}
.fig-svg{width:100%;display:block;overflow:visible}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr;gap:8px}}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:12px;color:var(--muted)}
.leg-item{display:inline-flex;align-items:center;gap:6px}
.leg-sw{width:10px;height:10px;border-radius:2px;flex:none}
.svg-link{cursor:pointer}
.svg-link:hover .row-hl{fill:var(--paper-2)}
.svg-link:hover .row-lbl{fill:var(--accent)}

.skill-rank{width:100%;border-collapse:collapse;font-size:13px}
.skill-rank th{text-align:left;font-family:var(--font-mono);font-weight:400;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--rule-strong);background:var(--paper-2);white-space:nowrap}
.skill-rank td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.skill-rank tr:last-child td{border-bottom:none}
.skill-rank tr.click:hover{background:var(--paper-2)}
.bar-track{height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden;min-width:70px}
.bar-fill{height:100%;background:var(--slate);border-radius:3px}
.bar-fill.lead{background:var(--accent-mark)}

.pat-list{margin:0;padding:0;list-style:none}
.pat-list li{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.45}
.pat-list li:last-child{border-bottom:none}
.pat-count{font-family:var(--font-mono);font-size:12px;color:var(--slate-ink);background:var(--slate-pale);padding:2px 7px;border-radius:4px;min-width:52px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.pat-win{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-tint);padding:2px 6px;border-radius:4px;flex:none;white-space:nowrap}
.status-ok{display:inline-block;font-family:var(--font-mono);font-size:11.5px;color:var(--good);background:var(--good-pale);padding:2px 7px;border-radius:4px;white-space:nowrap}
.status-fail{display:inline-block;font-family:var(--font-mono);font-size:11.5px;color:var(--accent);background:var(--accent-tint);padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}

.tag{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--paper-2);color:var(--muted);border:1px solid var(--rule);margin:0 5px 4px 0;white-space:nowrap}
.tag.kind{background:var(--slate-pale);color:var(--slate-ink);border-color:transparent}
.tag.accent{background:var(--accent-tint);color:var(--accent);border-color:transparent}
.tag.gold{background:var(--paper-2);color:var(--ink-strong);border-color:var(--rule-strong)}
.unver{font-family:var(--font-mono);font-size:10px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.controls input,.controls select{font:inherit;font-size:13.5px;padding:7px 11px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface);color:var(--ink)}
.controls input[type=search]{min-width:220px;flex:1;max-width:340px}
.pill{font:inherit;font-size:12.5px;font-weight:500;padding:5px 12px;border:1px solid var(--rule-strong);border-radius:16px;background:transparent;color:var(--muted);cursor:pointer;transition:background 140ms ease,color 140ms ease,border-color 140ms ease}
.pill:hover{border-color:var(--ink);color:var(--ink-strong)}
.pill.on{background:var(--ink-strong);color:var(--paper);border-color:var(--ink-strong)}
.pill.accent-toggle.on{background:var(--accent);color:#ffffff;border-color:var(--accent)}
[data-theme="dark"] .pill.accent-toggle.on{color:#121212}
.clear-btn{background:none;border:none;font-size:12.5px;color:var(--accent);cursor:pointer;padding:4px 6px;text-decoration:underline;text-underline-offset:.2em}
.scope-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 14px;padding:8px 12px;background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;font-size:12.5px;color:var(--muted)}

.dossier-item{padding:22px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr 82px;gap:24px;align-items:start;transition:background 220ms var(--ease-out),opacity 180ms ease}
.dossier-item.dimmed,.entry.dimmed{opacity:.52}
.dossier-item.dimmed:hover,.entry.dimmed:hover{opacity:1}
@media(max-width:640px){.dossier-item{grid-template-columns:1fr;gap:12px}}
.dossier-item.flash{background:var(--accent-tint);margin:0 -12px;padding:22px 12px;border-radius:6px}
.dossier-title{margin:0 0 8px;font-family:var(--font-serif);font-weight:400;font-size:22px;line-height:1.25;color:var(--ink-strong)}
.dossier-rationale{margin:10px 0;font-size:14.5px;line-height:1.62;color:var(--ink);max-width:72ch}
.action-plate{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:12px 15px;margin:12px 0;font-size:14px;line-height:1.58;color:var(--ink-strong);max-width:74ch}
.action-plate strong{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-right:8px}
.quote{font-family:var(--font-serif);font-style:italic;font-size:15px;line-height:1.55;color:var(--muted);margin:8px 0;padding-left:14px;border-left:1px solid var(--rule-strong);max-width:68ch}
.score-col{text-align:right;padding-top:2px}
.score-val{font-family:var(--font-mono);font-size:26px;font-weight:400;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.score-lbl{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-top:4px}
.sess-links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11.5px;color:var(--soft);align-items:center}
.sess-links a{color:var(--muted);text-decoration:none;padding:2px 6px;border-radius:4px;background:var(--paper-2)}
.sess-links a.in-win{color:var(--accent);background:var(--accent-tint)}
.sess-links a:hover{color:var(--accent);background:var(--accent-tint)}

.sec-head{margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule-strong);display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
.sec-head h2{margin:0;font-family:var(--font-serif);font-weight:400;font-size:24px;color:var(--ink-strong)}
.sec-head-right{display:flex;align-items:baseline;gap:12px}
.sec-head .meta{font-family:var(--font-mono);font-size:12px;color:var(--soft)}
.link-btn{background:none;border:none;padding:0;font-family:var(--font-mono);font-size:11.5px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.link-btn:hover{color:var(--ink-strong)}

.skill-list{border-top:1px solid var(--rule)}
.skill-row{border-bottom:1px solid var(--rule);transition:opacity 160ms ease}
.skill-row.dimmed{opacity:.52}
.skill-row.dimmed:hover{opacity:1}
.skill-row>summary{list-style:none;cursor:pointer;padding:14px 4px;display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:8px 18px;align-items:center;transition:background 130ms ease}
.skill-row>summary::-webkit-details-marker{display:none}
.skill-row>summary:hover{background:var(--paper-2)}
.skill-row[open]>summary{border-bottom:1px solid var(--rule);background:var(--paper-2);padding-left:12px;padding-right:12px}
.sr-main{min-width:0}
.sr-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sr-name{font-weight:700;font-size:15.5px;color:var(--ink-strong)}
.sr-counts{font-family:var(--font-mono);font-size:11.5px;color:var(--soft)}
.sr-preview{margin:4px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74ch}
@media(max-width:640px){.skill-row>summary{grid-template-columns:1fr 18px}.sr-badges{grid-column:1 / -1}.sr-preview{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.sr-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sr-badges .tag{margin:0}
.sr-chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform 180ms var(--ease-out);flex:none}
.skill-row[open] .sr-chev{transform:rotate(180deg);stroke:var(--accent)}
.sr-body{padding:18px 14px 20px;background:var(--surface)}
.sr-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:820px){.sr-cols{grid-template-columns:1fr;gap:20px}}
.sr-col h4{margin:0 0 10px;font-family:var(--font-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sr-col ul{margin:0;padding:0;list-style:none}
.sr-col li{position:relative;padding:0 0 10px 14px;font-size:13.5px;line-height:1.56;color:var(--ink)}
.sr-col li:last-child{padding-bottom:0}
.sr-col li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent-mark)}
.sr-col.issues li{color:var(--muted)}
.sr-col.issues li::before{background:var(--slate-mid)}

.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
@media(max-width:820px){.skill-grid{grid-template-columns:1fr}}
.entry{padding:16px 0;border-bottom:1px solid var(--rule);transition:opacity 160ms ease}
.entry-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.entry-name{font-weight:700;font-size:15px;color:var(--ink-strong);line-height:1.4}
.entry-issues{font-size:13.5px;color:var(--muted);margin:4px 0 8px;line-height:1.52}
.entry ul{margin:6px 0 0 18px;padding:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.entry li{margin-bottom:4px}
.q-stack .quote.extra{display:none}
.q-stack.open .quote.extra{display:block}
.q-toggle{margin-top:4px;background:none;border:none;padding:2px 0;font-family:var(--font-mono);font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:.2em}
.q-toggle:hover{color:var(--ink-strong)}

.table-wrap{border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);overflow-x:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--font-mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px;border-bottom:1px solid var(--rule-strong);background:var(--paper-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink)}
tr.click{cursor:pointer;transition:background 120ms ease}
tr.click:hover{background:var(--paper-2)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pager-btns{display:flex;gap:8px;align-items:center}
.pager button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.4;cursor:default}
.pager button:not(:disabled):hover{border-color:var(--ink-strong)}

.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;pointer-events:none;z-index:40;transition:opacity 220ms var(--ease-out)}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(680px,95vw);background:var(--paper);border-left:1px solid var(--rule-strong);overflow-y:auto;padding:28px 30px 76px;box-shadow:var(--shadow-drawer);transform:translateX(100%);transition:transform 240ms var(--ease-drawer)}
.drawer-bg.on .drawer{transform:translateX(0)}
.drawer-close{position:sticky;top:0;float:right;width:32px;height:32px;border-radius:6px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.drawer-close:hover{border-color:var(--accent);color:var(--accent)}
.drawer h2{margin:0 42px 8px 0;font-family:var(--font-serif);font-weight:400;font-size:25px;line-height:1.2;color:var(--ink-strong)}
.drawer .dsec{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.drawer .dsec h4{margin:0 0 10px;font-family:var(--font-mono);font-size:11px;font-weight:400;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.drawer .drow{padding:10px 0;border-bottom:1px solid var(--rule)}
.drawer .drow:last-child{border-bottom:none}
.copy-btn{margin-left:8px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:4px;padding:2px 8px;font-family:var(--font-mono);font-size:11px;cursor:pointer;color:var(--muted)}
.copy-btn:hover{border-color:var(--ink);color:var(--ink-strong)}

.tip{position:fixed;z-index:50;pointer-events:none;background:#3e4e54;color:var(--paper-on-slate);border:1px solid var(--tip-border);padding:8px 11px;border-radius:6px;font-size:12px;line-height:1.45;max-width:290px;box-shadow:var(--shadow-tip);opacity:0;transform:translateY(4px);transition:opacity 130ms var(--ease-out),transform 130ms var(--ease-out)}
.tip.on{opacity:1;transform:translateY(0)}
.tip .t-head{font-weight:700;margin-bottom:3px;color:var(--paper-on-slate)}
.tip .t-sub{color:var(--muted-on-slate);font-family:var(--font-mono);font-size:11px}

.empty{color:var(--soft);font-style:italic;padding:34px;text-align:center}
.foot{max-width:1120px;margin:0 auto;padding:20px 28px 46px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--soft)}

@media(hover:hover) and (pointer:fine){
  .scatter-dot{transition:opacity 140ms ease,transform 140ms var(--ease-out)}
  .scatter-dot:hover{opacity:1}
}
@media(prefers-reduced-motion:reduce){
  .drawer,.tip,.scatter-dot{transition:opacity 120ms ease}
  .drawer{transform:none}
  .drawer-bg:not(.on) .drawer{display:none}
}
</style>
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="index.html"><span class="brand-dot" aria-hidden="true"></span>Session Intelligence</a>
    <nav class="chapters" aria-label="Dossier chapters">
      <a href="index.html" class="active" aria-current="page">Automation Roadmap</a>
      <a href="life.html">Behavioural Portrait</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle colour mode"></button>
  </div>
</header>

<div class="shell">
  <section class="hero">
    <div class="hero-top">
      <h1>Multi-Harness Automation Roadmap</h1>
      <div class="period-bar" id="periodBar" role="group" aria-label="Time window"></div>
    </div>
    <div class="hero-meta" id="sub"></div>
    <div class="tabs-wrap">
      <nav class="tabs" id="nav" aria-label="Roadmap views"></nav>
    </div>
  </section>
  <main id="main"></main>
</div>

<footer class="foot">
  <span id="footLeft">Session Intelligence</span>
  <span>session-intelligence</span>
</footer>

<div class="drawer-bg" id="dbg" onclick="closeDrawer()">
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" onclick="event.stopPropagation()"></aside>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const C = D.conversations || [], S = D.synthesis || {}, O = D.observations || [];
const byId = Object.create(null); C.forEach(c => { byId[c.session_id] = c; });
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtCopy = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const cap = s => s ? String(s).charAt(0).toUpperCase() + String(s).slice(1) : '';
const fmt = n => Number(n || 0).toLocaleString('en-GB');
const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
const uv = o => o && o.evidence_verified === false ? '<span class="unver">unverified</span>' : '';

const allSkillFric = Object.create(null);
C.forEach(c => {
  const fc = (c.friction || []).length;
  if(!fc) return;
  new Set(c.skills_invoked || []).forEach(sk => { allSkillFric[sk] = (allSkillFric[sk] || 0) + fc; });
});

function toggleQuotes(btn){
  const stack = btn.closest('.q-stack');
  if(!stack) return;
  const open = stack.classList.toggle('open');
  const extra = Number(btn.getAttribute('data-extra') || 0);
  btn.textContent = open ? 'Hide extra quotes' : `+${extra} more quote${extra>1?'s':''}`;
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function renderQuotes(quotes){
  if(!quotes || !quotes.length) return '';
  const extra = quotes.length - 1;
  return `<div class="q-stack">
    <blockquote class="quote">&ldquo;${esc(quotes[0])}&rdquo;</blockquote>
    ${quotes.slice(1).map(q => `<blockquote class="quote extra">&ldquo;${esc(q)}&rdquo;</blockquote>`).join('')}
    ${extra > 0 ? `<button type="button" class="q-toggle" data-extra="${extra}" aria-expanded="false" onclick="toggleQuotes(this)">+${extra} more quote${extra>1?'s':''}</button>` : ''}
  </div>`;
}

function toggleAllSkills(btn){
  const rows = [...document.querySelectorAll('.skill-row')];
  const anyClosed = rows.some(r => !r.open);
  rows.forEach(r => { r.open = anyClosed; });
  btn.textContent = anyClosed ? 'Collapse all' : 'Expand all';
}

const rootEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>';
function applyTheme(t){
  rootEl.setAttribute('data-theme', t);
  try { localStorage.setItem('si-theme', t); } catch(_) {}
  themeBtn.innerHTML = (t === 'dark' ? SUN + 'Light' : MOON + 'Dark');
}
let initTheme = 'light';
try { initTheme = localStorage.getItem('si-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(_) {}
applyTheme(initTheme);
themeBtn.onclick = () => applyTheme(rootEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

const tipEl = document.getElementById('tip');
function showTip(evt, head, sub){
  const pt = evt.touches ? evt.touches[0] : evt;
  tipEl.innerHTML = `<div class="t-head">${esc(head)}</div>${sub ? `<div class="t-sub">${esc(sub)}</div>` : ''}`;
  const x = Math.min(window.innerWidth - 305, Math.max(10, pt.clientX + 14));
  const y = Math.max(12, pt.clientY - 52);
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
  tipEl.classList.add('on');
}
function hideTip(){ tipEl.classList.remove('on'); }
document.addEventListener('touchend', hideTip, {passive: true});

const allDates = C.map(c => c.date).filter(Boolean).sort();
const minDateStr = allDates[0] || '';
const maxDateStr = allDates[allDates.length - 1] || '';
const spanDays = (minDateStr && maxDateStr)
  ? Math.round((new Date(maxDateStr + 'T00:00:00Z') - new Date(minDateStr + 'T00:00:00Z')) / 86400000) + 1
  : 0;

const PERIODS = [
  {id:'7d', label:'7d', days:7, title:'Last 7 days'},
  {id:'30d', label:'30d', days:30, title:'Last 30 days'},
  {id:'90d', label:'90d', days:90, title:'Last 90 days'},
  {id:'all', label:'All', days:0, title:'All sessions'},
];
const qp = new URLSearchParams(location.search);
let period = spanDays > 95 ? '90d' : 'all';
try {
  const saved = localStorage.getItem('si-period');
  if(saved && PERIODS.some(p => p.id === saved)) period = saved;
} catch(_) {}
if(qp.get('period') && PERIODS.some(p => p.id === qp.get('period'))) period = qp.get('period');

function cutoffFor(pid){
  const spec = PERIODS.find(p => p.id === pid);
  if(!spec || !spec.days || !maxDateStr) return '';
  const dt = new Date(maxDateStr + 'T00:00:00Z');
  dt.setUTCDate(dt.getUTCDate() - (spec.days - 1));
  return dt.toISOString().slice(0, 10);
}

function getWindowState(){
  const spec = PERIODS.find(p => p.id === period) || PERIODS[3];
  const cutoff = cutoffFor(period);
  const convs = cutoff ? C.filter(c => (c.date || '') >= cutoff) : C;
  const obs = cutoff ? O.filter(o => (o.date || '') >= cutoff) : O;
  const idSet = new Set(convs.map(c => c.session_id));
  const dates = convs.map(c => c.date).filter(Boolean).sort();
  const range = dates.length ? [dates[0], dates[dates.length - 1]] : (S.date_range || []);
  const narrowed = Boolean(cutoff && (period === '7d' || period === '30d' || convs.length < C.length * 0.95));

  const hMap = Object.create(null);
  const tMap = Object.create(null);
  const sMap = Object.create(null);
  const sFric = Object.create(null);
  convs.forEach(c => {
    const h = c.harness || 'unknown';
    hMap[h] = (hMap[h] || 0) + 1;
    if(c.task_type) tMap[c.task_type] = (tMap[c.task_type] || 0) + 1;
    const fc = (c.friction || []).length;
    const seenSk = new Set(c.skills_invoked || []);
    seenSk.forEach(sk => {
      sMap[sk] = (sMap[sk] || 0) + 1;
      if(fc) sFric[sk] = (sFric[sk] || 0) + fc;
    });
  });

  const hhRaw = (S.profile || {}).cron_health || {};
  let hh = {total_runs: hhRaw.total_runs || 0, total_failures: hhRaw.total_failures || 0, skills: hhRaw.skills || [], scoped: false};
  if(Array.isArray(hhRaw.daily) && hhRaw.daily.length){
    const bySk = Object.create(null);
    let tr = 0, tf = 0;
    hhRaw.daily.forEach(row => {
      if(cutoff && row.d < cutoff) return;
      const cur = bySk[row.skill] || (bySk[row.skill] = {skill: row.skill, completed: 0, failed: 0, silent: 0, total: 0});
      cur.completed += Number(row.completed || 0);
      cur.failed += Number(row.failed || 0);
      cur.silent += Number(row.silent || 0);
      cur.total += Number(row.total || 0);
      tr += Number(row.total || 0);
      tf += Number(row.failed || 0);
    });
    hh = {
      total_runs: tr,
      total_failures: tf,
      skills: Object.values(bySk).sort((a,b) => (b.failed - a.failed) || (b.total - a.total)),
      scoped: true,
    };
  }

  return {
    period,
    spec,
    cutoff,
    narrowed,
    convs,
    obs,
    idSet,
    range,
    harnesses: Object.entries(hMap).map(([k,v]) => ({k,v})).sort((a,b) => b.v - a.v),
    tasks: Object.entries(tMap).map(([k,v]) => ({k,v})).sort((a,b) => b.v - a.v),
    skills: Object.entries(sMap).map(([k,v]) => ({k,v,fric: sFric[k] || 0})).sort((a,b) => b.v - a.v),
    skillFric: sFric,
    cron: hh,
  };
}

let W = getWindowState();
const VALID_TABS = new Set(['Overview', 'Roadmap', 'Skills', 'Conversations', 'Observations']);
let tab = VALID_TABS.has(qp.get('tab')) ? qp.get('tab') : 'Overview';
let rk = '', onlyActiveThemes = false, onlyActiveSkills = false, skillSec = '';
let cf = {q:'', dom:'', type:'', har:'', kind:'', page:0};
let ot = '', oq = '', opage = 0;
const PAGE_SIZE = 50;

function setPeriod(pid){
  period = pid;
  try { localStorage.setItem('si-period', pid); } catch(_) {}
  cf.page = 0;
  opage = 0;
  W = getWindowState();
  render();
}

function buildPeriodBar(){
  const bar = document.getElementById('periodBar');
  bar.innerHTML = '';
  PERIODS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = period === p.id ? 'on' : '';
    b.setAttribute('aria-pressed', period === p.id ? 'true' : 'false');
    b.title = p.title;
    b.textContent = p.label;
    b.onclick = () => setPeriod(p.id);
    bar.appendChild(b);
  });
}

function updateChrome(){
  buildPeriodBar();
  const ver = W.obs.filter(o => o.evidence_verified).length;
  const shareNote = W.narrowed ? ` <span class="mono">(of ${fmt(C.length)})</span>` : '';
  document.getElementById('sub').innerHTML =
    `<span class="num">${fmt(W.convs.length)} sessions${shareNote}</span>` +
    (W.range.length ? `<span>&middot;</span><span class="mono">${esc(W.range[0])} to ${esc(W.range[1])}</span>` : '') +
    `<span>&middot;</span><span>${W.harnesses.length} harnesses</span>` +
    `<span>&middot;</span><span class="num">${fmt(ver)}/${fmt(W.obs.length)} quotes verified</span>`;
  document.getElementById('footLeft').textContent =
    `Session Intelligence · ${W.spec.title} · ${fmt(W.convs.length)} sessions · ${W.range.join(' to ')}`;
}

function countInWin(sids){
  if(!Array.isArray(sids) || !sids.length) return 0;
  let n = 0;
  for(const id of sids) if(W.idSet.has(id)) n++;
  return n;
}

const LMH_W = {low: 1, medium: 2, high: 3};
function themeSids(t){
  return (Array.isArray(t.matched_sessions) && t.matched_sessions.length) ? t.matched_sessions : (t.evidence_sessions || []);
}
function themeWinStats(t){
  const sids = themeSids(t);
  const fullFreq = Number(t.frequency || sids.length || 0);
  const fullScore = Number(t.automation_score || 0);
  if(!W.narrowed){
    return {freq: fullFreq, score: fullScore, fullFreq, fullScore, active: true};
  }
  const winFreq = countInWin(sids);
  const pw = LMH_W[t.est_payoff] || 2;
  const ew = LMH_W[t.est_effort] || 2;
  const winScore = Math.round(((winFreq * pw) / ew) * 10) / 10;
  return {freq: winFreq, score: winScore, fullFreq, fullScore, active: winFreq > 0};
}

function buildTabs(){
  const themes = S.automation_themes || [];
  const activeT = W.narrowed ? themes.filter(t => themeWinStats(t).active).length : themes.length;
  const themeCnt = W.narrowed ? `${activeT}/${themes.length}` : fmt(themes.length);
  const skillsCnt = (S.skill_backlog || []).length + (S.agents_md_rules || S.claude_md_rules || []).length;
  const tabs = [
    {id:'Overview', label:'Overview', count:null},
    {id:'Roadmap', label:'Roadmap', count:themeCnt},
    {id:'Skills', label:'Skills & Rules', count:fmt(skillsCnt)},
    {id:'Conversations', label:'Conversations', count:fmt(W.convs.length)},
    {id:'Observations', label:'Observations', count:fmt(W.obs.length)},
  ];
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  tabs.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = tab === t.id ? 'on' : '';
    b.setAttribute('aria-current', tab === t.id ? 'page' : 'false');
    b.innerHTML = esc(t.label) + (t.count != null ? `<span class="cnt">${esc(t.count)}</span>` : '');
    b.onclick = () => { tab = t.id; render(); window.scrollTo({top: 0, behavior: 'auto'}); };
    nav.appendChild(b);
  });
}

function filterToConv(patch){
  cf = {q:'', dom:'', type:'', har:'', kind:'', page:0, ...patch};
  tab = 'Conversations';
  render();
  window.scrollTo({top: 0, behavior: 'auto'});
}

function isoWeek(dateStr){
  if(!dateStr || dateStr.length < 10) return null;
  const d = new Date(dateStr + 'T00:00:00Z');
  if(isNaN(d)) return null;
  const day = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - day);
  return d.toISOString().slice(0, 10);
}

function dayList(startStr, endStr){
  const out = [];
  let cur = new Date(startStr + 'T00:00:00Z');
  const end = new Date(endStr + 'T00:00:00Z');
  while(cur <= end){
    out.push(cur.toISOString().slice(0, 10));
    cur.setUTCDate(cur.getUTCDate() + 1);
  }
  return out;
}

function weekList(startStr, endStr){
  const out = [];
  let cur = new Date(startStr + 'T00:00:00Z');
  const end = new Date(endStr + 'T00:00:00Z');
  while(cur <= end){
    out.push(cur.toISOString().slice(0, 10));
    cur.setUTCDate(cur.getUTCDate() + 7);
  }
  return out;
}

function renderCadenceSvg(slot){
  const width = Math.max(280, Math.floor(slot.clientWidth || 960));
  const compact = width < 560;
  const dailyMode = W.period === '7d' || W.period === '30d';
  const convs = W.convs;
  if(!convs.length){ slot.innerHTML = '<div class="empty">No sessions in this period.</div>'; return; }

  const buckets = new Map();
  const hTotals = Object.create(null);
  let olderCount = 0;
  const softCut = (!dailyMode && W.period === 'all' && spanDays > 105 && maxDateStr)
    ? new Date(new Date(maxDateStr + 'T00:00:00Z').getTime() - 95 * 86400000).toISOString().slice(0, 10)
    : '';
  convs.forEach(c => {
    if(softCut && c.date && c.date < softCut){ olderCount++; return; }
    const key = dailyMode ? (c.date || '').slice(0, 10) : isoWeek(c.date);
    if(!key || key.length < 10) return;
    const h = c.harness || 'other';
    hTotals[h] = (hTotals[h] || 0) + 1;
    if(!buckets.has(key)) buckets.set(key, Object.create(null));
    const b = buckets.get(key);
    b[h] = (b[h] || 0) + 1;
  });
  const rawKeys = [...buckets.keys()].sort();
  if(!rawKeys.length){ slot.innerHTML = '<div class="empty">No dated sessions in this period.</div>'; return; }

  let keys;
  if(dailyMode){
    const startK = W.cutoff || rawKeys[0];
    const endK = maxDateStr || rawKeys[rawKeys.length - 1];
    keys = dayList(startK, endK);
  } else {
    keys = weekList(rawKeys[0], rawKeys[rawKeys.length - 1]);
  }

  const topH = Object.entries(hTotals).sort((a,b) => b[1]-a[1]).slice(0, 4).map(x => x[0]);
  const hasOther = Object.keys(hTotals).some(h => !topH.includes(h));
  const series = hasOther ? [...topH, 'other'] : topH;
  const colours = {
    [topH[0]]: 'var(--accent-mark)',
    [topH[1]]: 'var(--slate)',
    [topH[2]]: 'var(--accent-mid)',
    [topH[3]]: 'var(--slate-mid)',
    other: 'var(--series-muted)'
  };

  let maxV = 1, peakKey = '', peakVal = 0;
  const data = keys.map(k => {
    const b = buckets.get(k) || {};
    const row = {k, total: 0, parts: {}, isWknd: false};
    if(dailyMode){
      const dow = new Date(k + 'T00:00:00Z').getUTCDay();
      row.isWknd = dow === 0 || dow === 6;
    }
    Object.entries(b).forEach(([h, n]) => {
      const s = topH.includes(h) ? h : 'other';
      row.parts[s] = (row.parts[s] || 0) + n;
      row.total += n;
    });
    if(row.total > maxV) maxV = row.total;
    if(row.total > peakVal){ peakVal = row.total; peakKey = k; }
    return row;
  });

  const stepUnit = maxV <= 10 ? 2 : maxV <= 40 ? 10 : maxV <= 120 ? 25 : 50;
  const niceMax = Math.ceil(maxV / stepUnit) * stepUnit || maxV;
  const H = compact ? 195 : 210, ml = compact ? 32 : 40, mr = 10, mt = 14, mb = 28;
  const pw = width - ml - mr, ph = H - mt - mb;
  const step = pw / data.length;
  const bw = Math.max(4, Math.min(compact ? 26 : 44, step * 0.66));

  let grid = '';
  for(let i = 0; i <= 4; i++){
    const v = Math.round((niceMax / 4) * i);
    const y = mt + ph - (v / niceMax) * ph;
    grid += `<line x1="${ml}" y1="${y.toFixed(1)}" x2="${width-mr}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
    grid += `<text x="${ml-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="var(--font-mono)" font-size="10.5" fill="var(--soft)">${v}</text>`;
  }

  let cols = '';
  const maxTicks = compact ? 5 : 9;
  const tickEvery = Math.max(1, Math.ceil(data.length / maxTicks));
  data.forEach((d, idx) => {
    const cx = ml + idx * step + step / 2;
    const x = cx - bw / 2;
    if(d.isWknd){
      cols += `<rect x="${(ml + idx * step).toFixed(1)}" y="${mt}" width="${step.toFixed(1)}" height="${ph}" fill="var(--weekend-tint)"/>`;
    }
    let yAcc = mt + ph;
    const tipLines = series.filter(s => d.parts[s]).map(s => `${s}: ${d.parts[s]}`).join(' · ') || 'No sessions';
    series.forEach(s => {
      const v = d.parts[s] || 0;
      if(!v) return;
      const bh = (v / niceMax) * ph;
      yAcc -= bh;
      cols += `<rect x="${x.toFixed(1)}" y="${yAcc.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, bh).toFixed(1)}" fill="${colours[s]}" rx="1"/>`;
    });
    const labelHead = dailyMode ? `${d.k} (${d.total} sessions)` : `Week of ${d.k} (${d.total} sessions)`;
    cols += `<rect x="${(cx - step/2).toFixed(1)}" y="${mt}" width="${step.toFixed(1)}" height="${ph}" fill="transparent" style="cursor:crosshair"
      onmousemove="showTip(event,'${esc(labelHead)}','${esc(tipLines)}')" ontouchstart="showTip(event,'${esc(labelHead)}','${esc(tipLines)}')" onmouseleave="hideTip()"/>`;
    if(idx % tickEvery === 0 || idx === data.length - 1){
      cols += `<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle" font-family="var(--font-mono)" font-size="10.5" fill="var(--soft)">${esc(d.k.slice(5))}</text>`;
    }
  });

  const fig = slot.closest('figure');
  if(fig){
    const claimEl = fig.querySelector('.fig-claim');
    const subEl = fig.querySelector('.fig-sub');
    const noteEl = fig.querySelector('.fig-note');
    const legEl = fig.querySelector('.legend');
    if(claimEl) claimEl.textContent = dailyMode
      ? `Activity peaked at ${fmt(peakVal)} sessions on ${peakKey}`
      : `Activity peaked at ${fmt(peakVal)} sessions in the week of ${peakKey}`;
    if(subEl) subEl.textContent = dailyMode
      ? `Daily sessions by harness (stacked count, n = ${fmt(convs.length - olderCount)})`
      : `Contiguous weekly sessions by harness (stacked count, n = ${fmt(convs.length - olderCount)})`;
    if(legEl) legEl.innerHTML = series.map(s => `<span class="leg-item"><span class="leg-sw" style="background:${colours[s]}"></span>${esc(s)}</span>`).join('');
    const extra = olderCount ? ` Excludes ${olderCount} earlier-dated note${olderCount>1?'s':''} modified inside the run.` : '';
    const wkndNote = dailyMode ? ' Shaded columns mark weekends.' : '';
    if(noteEl) noteEl.textContent = `Source: local runtime transcripts, session notes and scheduled-job logs.${wkndNote}${extra}`;
  }

  slot.innerHTML = `<svg class="fig-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Session cadence by harness">
    ${grid}
    <line x1="${ml}" y1="${mt+ph}" x2="${width-mr}" y2="${mt+ph}" stroke="var(--rule-strong)" stroke-width="1"/>
    ${cols}
  </svg>`;
}

function renderHarnessSvg(slot){
  const items = W.harnesses;
  if(!items.length){ slot.innerHTML = '<div class="empty">No harness data in this period.</div>'; return; }
  const width = Math.max(260, Math.floor(slot.clientWidth || 500));
  const stacked = width < 430;
  const top = items.slice(0, 8);
  const total = sum(items, x => x.v) || 1;
  const max = Math.max(1, ...top.map(x => x.v));

  let H, rows;
  if(stacked){
    const rowH = 38, mt = 4, mb = 6, mr = 8;
    H = mt + top.length * rowH + mb;
    const pw = width - mr;
    rows = top.map((it, i) => {
      const y = mt + i * rowH;
      const bw = Math.max(4, (it.v / max) * pw);
      const pct = ((it.v / total) * 100).toFixed(1);
      const fill = i === 0 ? 'var(--accent-mark)' : 'var(--series-muted)';
      const txtCol = i === 0 ? 'var(--ink-strong)' : 'var(--ink)';
      return `<g class="svg-link" onclick="filterToConv({har:'${esc(it.k)}'})">
        <rect class="row-hl" x="0" y="${y}" width="${width}" height="${rowH - 2}" rx="4" fill="transparent"/>
        <text class="row-lbl" x="2" y="${y + 13}" font-size="12.5" font-weight="${i===0?700:500}" fill="${txtCol}">${esc(it.k)}</text>
        <text x="${width - 2}" y="${y + 13}" text-anchor="end" font-family="var(--font-mono)" font-size="11.5" fill="${txtCol}">${fmt(it.v)} <tspan fill="var(--soft)">(${pct}%)</tspan></text>
        <rect x="2" y="${y + 20}" width="${bw.toFixed(1)}" height="11" rx="2" fill="${fill}"/>
      </g>`;
    }).join('');
  } else {
    const rowH = 30, ml = 98, mr = 92, mt = 4, mb = 6;
    H = mt + top.length * rowH + mb;
    const pw = Math.max(80, width - ml - mr);
    rows = top.map((it, i) => {
      const y = mt + i * rowH;
      const bw = Math.max(3, (it.v / max) * pw);
      const pct = ((it.v / total) * 100).toFixed(1);
      const fill = i === 0 ? 'var(--accent-mark)' : 'var(--series-muted)';
      const txtCol = i === 0 ? 'var(--ink-strong)' : 'var(--ink)';
      return `<g class="svg-link" onclick="filterToConv({har:'${esc(it.k)}'})">
        <rect class="row-hl" x="0" y="${y}" width="${width}" height="${rowH}" rx="4" fill="transparent"/>
        <text class="row-lbl" x="${ml - 10}" y="${y + 19}" text-anchor="end" font-size="13" font-weight="${i===0?700:400}" fill="${txtCol}">${esc(it.k)}</text>
        <rect x="${ml}" y="${y + 7}" width="${bw.toFixed(1)}" height="15" rx="2" fill="${fill}"/>
        <text x="${ml + bw + 8}" y="${y + 19}" font-family="var(--font-mono)" font-size="11.5" fill="${txtCol}">${fmt(it.v)} <tspan fill="var(--soft)">(${pct}%)</tspan></text>
      </g>`;
    }).join('');
  }

  slot.innerHTML = `<svg class="fig-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Sessions by harness">
    ${rows}
  </svg>`;
}

function renderTaskDotSvg(slot){
  const items = W.tasks;
  if(!items.length){ slot.innerHTML = '<div class="empty">No task data in this period.</div>'; return; }
  const width = Math.max(260, Math.floor(slot.clientWidth || 500));
  const compact = width < 430;
  const top = items.slice(0, 10);
  const max = Math.max(1, ...top.map(x => x.v));
  const rowH = 26, ml = compact ? 88 : 110, mr = 46, mt = 6, mb = 6;
  const H = mt + top.length * rowH + mb;
  const pw = Math.max(80, width - ml - mr);

  const rows = top.map((it, i) => {
    const y = mt + i * rowH + rowH / 2;
    const cx = ml + (it.v / max) * pw;
    const isTop = i < 3;
    const col = isTop ? 'var(--accent-mark)' : 'var(--muted)';
    const lbl = it.k.length > (compact ? 11 : 16) ? it.k.slice(0, compact ? 10 : 15) + '…' : it.k;
    return `<g class="svg-link" onclick="filterToConv({type:'${esc(it.k)}'})">
      <rect class="row-hl" x="0" y="${(y - rowH/2).toFixed(1)}" width="${width}" height="${rowH}" rx="4" fill="transparent"/>
      <line x1="${ml}" y1="${y}" x2="${width - mr}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>
      <line x1="${ml}" y1="${y}" x2="${cx.toFixed(1)}" y2="${y}" stroke="${col}" stroke-width="${isTop?2:1.25}"/>
      <circle cx="${cx.toFixed(1)}" cy="${y}" r="${isTop?4.5:3.5}" fill="${col}"/>
      <text class="row-lbl" x="${ml - 10}" y="${y + 4}" text-anchor="end" font-size="12.5" font-weight="${isTop?600:400}" fill="${isTop?'var(--ink-strong)':'var(--ink)'}">${esc(lbl)}</text>
      <text x="${width - mr + 8}" y="${y + 4}" font-family="var(--font-mono)" font-size="11.5" fill="${isTop?'var(--ink-strong)':'var(--muted)'}">${fmt(it.v)}</text>
    </g>`;
  }).join('');

  slot.innerHTML = `<svg class="fig-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Sessions by task category">
    ${rows}
  </svg>`;
}

function rankedThemes(){
  return (S.automation_themes || [])
    .map(t => ({t, st: themeWinStats(t)}))
    .sort((a, b) => (b.st.score - a.st.score) || (b.st.freq - a.st.freq) || (b.st.fullScore - a.st.fullScore));
}

function renderMatrixSvg(slot){
  const ranked = rankedThemes();
  if(!ranked.length){ slot.innerHTML = ''; return; }
  const visible = W.narrowed ? ranked.filter(x => x.st.active) : ranked;
  if(!visible.length){
    slot.innerHTML = `<div class="empty">No roadmap themes have linked sessions in ${esc(W.spec.title.toLowerCase())}. Widen the window above to compare themes.</div>`;
    return;
  }
  const width = Math.max(280, Math.floor(slot.clientWidth || 960));
  const compact = width < 560;
  const effMap = {low: 1, medium: 2, high: 3};
  const kindCol = {
    'improve-skill': 'var(--accent-mark)',
    'agents-md-rule': 'var(--slate)',
    'template-fix': 'var(--accent)',
    'new-skill': 'var(--accent-mid)',
    'new-cron': 'var(--slate-mid)'
  };
  const rawMaxF = Math.max(1, ...visible.map(x => x.st.freq));
  const stepUnit = rawMaxF <= 8 ? 4 : rawMaxF <= 20 ? 8 : rawMaxF <= 80 ? 20 : 40;
  const maxFreq = Math.max(4, Math.ceil(rawMaxF / stepUnit) * stepUnit);
  const maxScore = Math.max(1, ...visible.map(x => x.st.score));
  const H = compact ? 230 : 255, ml = compact ? 38 : 50, mr = 22, mt = 24, mb = 36;
  const pw = width - ml - mr, ph = H - mt - mb;
  const effLabels = [{v:1, l:compact?'Low':'Low effort'},{v:2, l:compact?'Medium':'Medium effort'},{v:3, l:compact?'High':'High effort'}];

  let grid = '';
  for(let i = 0; i <= 4; i++){
    const v = Math.round((maxFreq / 4) * i);
    const y = mt + ph - (v / maxFreq) * ph;
    grid += `<line x1="${ml}" y1="${y.toFixed(1)}" x2="${width-mr}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>`;
    grid += `<text x="${ml-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="var(--font-mono)" font-size="10.5" fill="var(--soft)">${v}</text>`;
  }
  const colW = pw / 3;
  effLabels.forEach((e, idx) => {
    const cx = ml + colW * idx + colW / 2;
    grid += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${e.l}</text>`;
  });

  const byEff = {1:[], 2:[], 3:[]};
  visible.forEach((entry, idx) => {
    const ev = effMap[entry.t.est_effort] || 2;
    byEff[ev].push({t: entry.t, st: entry.st, idx});
  });

  let dots = '';
  [1, 2, 3].forEach(ev => {
    const list = byEff[ev];
    list.forEach((item, pos) => {
      const t = item.t, st = item.st;
      const spread = list.length > 1 ? ((pos / (list.length - 1)) - 0.5) * (colW * 0.68) : 0;
      const cx = ml + colW * (ev - 1) + colW / 2 + spread;
      const cy = mt + ph - (st.freq / maxFreq) * ph;
      const r = (compact ? 5 : 6) + Math.sqrt(Math.max(0.1, st.score) / maxScore) * (compact ? 10 : 14);
      const col = kindCol[t.kind] || 'var(--slate)';
      const subTip = W.narrowed
        ? `Window score ${st.score} · ${st.freq} sessions in ${W.spec.label} (${st.fullFreq} total) · ${t.kind} · effort ${t.est_effort}`
        : `Score ${st.score} · ${st.freq} sessions · ${t.kind} · effort ${t.est_effort}`;
      dots += `<circle class="scatter-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" fill-opacity="0.86" stroke="var(--paper)" stroke-width="1.5" style="cursor:pointer"
        onclick="jumpTheme(${item.idx})"
        onmousemove="showTip(event,'${esc(t.title)}','${esc(subTip)}')"
        ontouchstart="showTip(event,'${esc(t.title)}','${esc(subTip)}')"
        onmouseleave="hideTip()"/>`;
      if(item.idx < 5){
        if(r >= 11){
          const txtFill = t.kind === 'new-skill' ? '#1a1a1a' : '#ffffff';
          dots += `<text x="${cx.toFixed(1)}" y="${(cy + 3.5).toFixed(1)}" text-anchor="middle" font-family="var(--font-mono)" font-size="10" font-weight="600" fill="${txtFill}" style="pointer-events:none">#${item.idx+1}</text>`;
        } else {
          dots += `<text x="${cx.toFixed(1)}" y="${(cy - r - 4).toFixed(1)}" text-anchor="middle" font-family="var(--font-mono)" font-size="10" fill="var(--ink-strong)" style="pointer-events:none">#${item.idx+1}</text>`;
        }
      }
    });
  });

  slot.innerHTML = `<svg class="fig-svg" width="${width}" height="${H}" viewBox="0 0 ${width} ${H}" role="img" aria-label="Automation themes by effort and session frequency">
    ${grid}
    <line x1="${ml}" y1="${mt+ph}" x2="${width-mr}" y2="${mt+ph}" stroke="var(--rule-strong)" stroke-width="1"/>
    ${dots}
  </svg>`;
}

function matrixClaim(ranked){
  const active = W.narrowed ? ranked.filter(x => x.st.active) : ranked;
  if(!active.length) return `No roadmap themes matched sessions in the ${W.spec.title.toLowerCase()}`;
  const top = active[0];
  const lowWins = active.filter(x => x.t.est_effort === 'low').length;
  const scope = W.narrowed ? ` in the ${W.spec.title.toLowerCase()}` : '';
  if(lowWins > 0){
    return `Top theme spans ${fmt(top.st.freq)} sessions${scope} at ${top.t.est_effort || 'medium'} effort, with ${lowWins} low-effort quick win${lowWins>1?'s':''}`;
  }
  return `Top opportunity spans ${fmt(top.st.freq)} sessions${scope} at ${top.t.est_effort || 'medium'} effort across ${active.length} active themes`;
}

function jumpTheme(idx){
  const el = document.getElementById('theme-' + idx);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1200);
}

function windowSummaryText(fr, ac){
  const P = S.profile || {};
  if(!W.narrowed && P.summary) return {text: P.summary, live: false};
  if(!W.convs.length) return {text: `No sessions recorded in ${W.spec.title.toLowerCase()}.`, live: true};
  const leadH = W.harnesses[0];
  const leadPct = leadH ? Math.round((leadH.v / W.convs.length) * 100) : 0;
  const topTasks = W.tasks.slice(0, 2).map(t => `${t.k} (${fmt(t.v)})`).join(' and ');
  return {
    text: `In the ${W.spec.title.toLowerCase()} (${W.range.join(' to ')}), ${fmt(W.convs.length)} sessions ran across ${W.harnesses.length} harnesses, led by ${leadH ? cap(leadH.k) : 'your fleet'} (${leadPct}%). ${topTasks ? `Effort centred on ${topTasks}, surfacing ` : 'Sessions surfaced '}${fmt(fr)} friction points and ${fmt(ac)} automation ideas.`,
    live: true,
  };
}

function viewOverview(){
  const fr = sum(W.convs, c => (c.friction||[]).length);
  const ac = sum(W.convs, c => (c.automation_candidates||[]).length);
  const toil = sum(W.convs, c => (c.toil||[]).length);
  const pref = sum(W.convs, c => (c.preferences||[]).length);
  const themes = S.automation_themes || [];
  const activeThemes = W.narrowed ? themes.filter(t => themeWinStats(t).active).length : themes.length;
  const P = S.profile || {};
  const rp = (P.recurring_patterns || []).slice(0, 8);
  const hh = W.cron;

  const leadH = W.harnesses[0];
  const leadHPct = leadH ? Math.round((leadH.v / Math.max(1, W.convs.length)) * 100) : 0;
  const harnessClaim = leadH
    ? `${cap(leadH.k)} carries ${leadHPct}% of activity across ${W.harnesses.length} harnesses`
    : 'Sessions by harness';
  const leadTask = W.tasks[0]
    ? `${cap(W.tasks[0].k)} leads work mix (${fmt(W.tasks[0].v)} sessions, ${Math.round(100*W.tasks[0].v/Math.max(1,W.convs.length))}%)`
    : 'Work mix by task type';

  const maxSk = Math.max(1, ...topSk.map(x => x.v));
  const skillClaim = topSk[0]
    ? `${cap(topSk[0].k)}${topSk[1] ? ' and ' + topSk[1].k : ''} lead recorded skill invocations`

  const kpis = [
    ['Sessions', fmt(W.convs.length), W.narrowed ? `of ${fmt(C.length)} total` : ''],

    ['Automation ideas', fmt(ac), ''],
    ['Toil observations', fmt(toil), ''],
    ['Durable rules', fmt(pref), ''],
    [W.narrowed ? 'Active themes' : 'Roadmap themes', W.narrowed ? `${activeThemes}/${themes.length}` : fmt(themes.length), W.narrowed ? 'cited in window' : ''],

      <td style="width:34%"><div class="bar-track"><div class="bar-fill ${i===0?'lead':''}" style="width:${Math.max(4, Math.round((s.v/maxSk)*100))}%"></div></div></td>
      <td class="num" style="text-align:right;font-family:var(--font-mono);font-size:12px">${fmt(s.v)}</td>

  const cronRows = (hh.skills || []).slice(0, 9).map(s => `

    </tr>`).join('');

  const cronSub = hh.scoped
    ? `Scheduled job reliability in ${W.spec.title.toLowerCase()} (top 9 by failure then volume)`

      <div class="lever-body">

          <span class="lever-tag">Highest-leverage action</span>
          ${W.narrowed ? '<span class="scope-note">Full-window synthesis</span>' : ''}

    ${summary.text ? `<section class="summary-band">
      <div class="summary-head">
        <h2>Where effort concentrates</h2>
        ${summary.live ? `<span class="scope-note">${esc(W.spec.title)}</span>` : ''}
      </div>
      <p>${esc(summary.text)}</p>
    </section>` : ''}
    <figure class="fig">
      <div class="fig-head">
        <p class="fig-claim">Session cadence</p>
        <p class="fig-sub"></p>
      </div>
      <div class="legend"></div>
      <div class="chart-slot" data-chart="cadence"></div>
      <figcaption class="fig-note"></figcaption>
    </figure>
    <div class="grid2">
      <figure class="fig">
        <div class="fig-head">
          <p class="fig-claim">${esc(harnessClaim)}</p>

      <figure class="fig">
        <div class="fig-head">

    </div>
    <figure class="fig">

      ${rp.length ? `<ul class="pat-list">${rp.map(p => {
        const iw = W.narrowed ? countInWin(p.sessions) : 0;
        return `<li><span class="pat-count">${fmt(p.count)}&times;</span><span>${esc(p.pattern)}</span>${iw ? `<span class="pat-win">${iw} in ${esc(W.spec.label)}</span>` : ''}</li>`;
      }).join('')}</ul>` : '<div class="empty">No recurring patterns recorded.</div>'}
    </figure>`;
}

function viewRoadmap(){
  const ranked = rankedThemes();
  if(!ranked.length) return '<div class="empty">No roadmap themes generated yet.</div>';
  const kinds = [...new Set(ranked.map(x => x.t.kind).filter(Boolean))];
  const activeCount = ranked.filter(x => x.st.active).length;
  const rows = ranked.filter(x => {
    if(rk && x.t.kind !== rk) return false;
    if(W.narrowed && onlyActiveThemes && !x.st.active) return false;
    return true;
  });

  const kindCol = {
    'improve-skill': 'var(--accent-mark)',
    'agents-md-rule': 'var(--slate)',
    'template-fix': 'var(--accent)',
    'new-skill': 'var(--accent-mid)',
    'new-cron': 'var(--slate-mid)'
  };
  const leg = Object.entries(kindCol).map(([k,c]) => `<span class="leg-item"><span class="leg-sw" style="background:${c}"></span>${esc(k)}</span>`).join('');
  const banner = W.narrowed
    ? `<div class="scope-banner"><span>Themes are synthesised across all ${fmt(C.length)} sessions and re-ranked by ${esc(W.spec.title.toLowerCase())} activity (${activeCount} of ${ranked.length} active).</span><span class="scope-note">Live window ranking</span></div>`
    : '';
  const pills = `<div class="controls">
    <button type="button" class="pill ${rk===''?'on':''}" aria-pressed="${rk===''}" onclick="rk='';render()">All ${ranked.length}</button>
    ${kinds.map(k => `<button type="button" class="pill ${rk===k?'on':''}" aria-pressed="${rk===k}" onclick="rk='${esc(k)}';render()">${esc(k)} ${ranked.filter(x=>x.t.kind===k).length}</button>`).join('')}
    ${W.narrowed ? `<button type="button" class="pill accent-toggle ${onlyActiveThemes?'on':''}" aria-pressed="${onlyActiveThemes}" onclick="onlyActiveThemes=!onlyActiveThemes;render()">Active in ${esc(W.spec.label)} (${activeCount})</button>` : ''}
  </div>`;

  const list = rows.length ? rows.map(entry => {
    const t = entry.t, st = entry.st;
    const origIdx = ranked.indexOf(entry);
    const dimmed = W.narrowed && !st.active;
    const freqLabel = W.narrowed
      ? `${fmt(st.freq)} in ${W.spec.label} · ${fmt(st.fullFreq)} total`
      : `${fmt(st.fullFreq)} sessions`;
    const scoreMain = st.score != null ? st.score : '&ndash;';
    const scoreSub = W.narrowed ? `${W.spec.label} score · full ${st.fullScore}` : 'score';
    return `<article class="dossier-item ${dimmed?'dimmed':''}" id="theme-${origIdx}">
      <div>
        <h3 class="dossier-title">${origIdx + 1}. ${fmtCopy(t.title)}</h3>
        <div>
          <span class="tag kind">${esc(t.kind)}</span>
          <span class="tag num ${W.narrowed && st.active ? 'accent' : ''}">${esc(freqLabel)}</span>
          <span class="tag">effort: ${esc(t.est_effort||'?')}</span>
          <span class="tag gold">payoff: ${esc(t.est_payoff||'?')}</span>
        </div>
        ${t.rationale ? `<p class="dossier-rationale">${fmtCopy(t.rationale)}</p>` : ''}
        <div class="action-plate"><strong>Action</strong>${fmtCopy(t.proposed_action)}</div>
        ${renderQuotes(t.example_quotes || [])}
        ${(t.evidence_sessions||[]).length ? `<div class="sess-links"><span>Sessions:</span>${t.evidence_sessions.slice(0,12).map(s => `<a class="${W.narrowed && W.idSet.has(s)?'in-win':''}" onclick="openConv('${esc(s)}')">${esc(String(s).slice(0,8))}</a>`).join('')}${t.evidence_sessions.length > 12 ? `<span>+${t.evidence_sessions.length-12} more</span>` : ''}</div>` : ''}
      </div>
      <div class="score-col">
        <div class="score-val">${scoreMain}</div>
        <div class="score-lbl">${esc(scoreSub)}</div>
      </div>
    </article>`;
  }).join('') : '<div class="empty">No themes match this filter. Turn off the active-only toggle to inspect full-window themes.</div>';

  const matrixSub = W.narrowed
    ? `Sessions in ${W.spec.title.toLowerCase()} (y-axis) by estimated effort (x-axis); bubble area scales with window score (${activeCount} active themes). Click any bubble to jump.`
    : 'Supporting sessions (y-axis) by estimated effort (x-axis); bubble area scales with automation score. Click any bubble to jump to its brief.';

  return banner + `<figure class="fig" style="border-top:none;padding-top:4px">
    <div class="fig-head">
      <p class="fig-claim">${esc(matrixClaim(ranked))}</p>
      <p class="fig-sub">${esc(matrixSub)}</p>
    </div>
    <div class="legend">${leg}</div>
    <div class="chart-slot" data-chart="matrix"></div>
  </figure>` + pills + list;
}

function viewSkills(){
  const totalFFor = s => Math.max(allSkillFric[s.skill] || 0, W.skillFric[s.skill] || 0, Number(s.friction_count || 0));
  const sbAll = (S.skill_backlog||[]).slice().sort((a,b) => {
    if(W.narrowed){
      const d = (W.skillFric[b.skill] || 0) - (W.skillFric[a.skill] || 0);
      if(d !== 0) return d;
    }
    return totalFFor(b) - totalFFor(a);
  });
  const ns = S.new_skills || [], nc = S.new_crons || [], rules = S.agents_md_rules || S.claude_md_rules || [];
  const activeSkills = sbAll.filter(s => (W.skillFric[s.skill] || 0) > 0 || countInWin(s.sessions) > 0).length;
  const sb = W.narrowed && onlyActiveSkills
    ? sbAll.filter(s => (W.skillFric[s.skill] || 0) > 0 || countInWin(s.sessions) > 0)
    : sbAll;

  const banner = W.narrowed
    ? `<div class="scope-banner"><span>Backlog and rules are synthesised across the full run. Live ${esc(W.spec.label)} friction events appear beside full-run totals.</span><span class="scope-note">Full-window synthesis</span></div>`
    : '';

  const secPills = `<div class="controls">
    <button type="button" class="pill ${skillSec===''?'on':''}" aria-pressed="${skillSec===''}" onclick="skillSec='';render()">All</button>
    <button type="button" class="pill ${skillSec==='backlog'?'on':''}" aria-pressed="${skillSec==='backlog'}" onclick="skillSec='backlog';render()">Skill backlog ${sbAll.length}</button>
    <button type="button" class="pill ${skillSec==='rules'?'on':''}" aria-pressed="${skillSec==='rules'}" onclick="skillSec='rules';render()">AGENTS.md rules ${rules.length}</button>
    <button type="button" class="pill ${skillSec==='new'?'on':''}" aria-pressed="${skillSec==='new'}" onclick="skillSec='new';render()">New skills &amp; crons ${ns.length + nc.length}</button>
    ${W.narrowed ? `<button type="button" class="pill accent-toggle ${onlyActiveSkills?'on':''}" aria-pressed="${onlyActiveSkills}" onclick="onlyActiveSkills=!onlyActiveSkills;render()">Active in ${esc(W.spec.label)} (${activeSkills})</button>` : ''}
  </div>`;

  const chev = '<svg class="sr-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

  const backlogHtml = (!skillSec || skillSec === 'backlog') ? `
    <div class="sec-head">
      <h2>Skill improvement backlog</h2>
      <div class="sec-head-right">
        <span class="meta">${sb.length} evidenced skills · click any row to inspect</span>
        ${sb.length ? '<button type="button" class="link-btn" onclick="toggleAllSkills(this)">Expand all</button>' : ''}
      </div>
    </div>
    ${sb.length ? `<div class="skill-list">${sb.map(s => {
      const liveF = W.skillFric[s.skill] || 0;
      const totF = totalFFor(s);
      const iw = countInWin(s.sessions);
      const dimmed = W.narrowed && liveF === 0 && iw === 0;
      const issues = s.issues || [];
      const edits = s.proposed_edits || [];
      const lead = edits[0] || issues[0] || '';
      const countTxt = [
        edits.length ? `${edits.length} edit${edits.length>1?'s':''}` : '',
        issues.length ? `${issues.length} issue${issues.length>1?'s':''}` : ''
      ].filter(Boolean).join(' · ');
      return `<details class="skill-row ${dimmed?'dimmed':''}">
        <summary>
          <div class="sr-main">
            <div class="sr-top">
              <span class="sr-name">${esc(s.skill)}</span>
              ${countTxt ? `<span class="sr-counts">${esc(countTxt)}</span>` : ''}
            </div>
            ${lead ? `<p class="sr-preview">${fmtCopy(lead)}</p>` : ''}
          </div>
          <div class="sr-badges">
            ${W.narrowed && liveF ? `<span class="tag accent num">${fmt(liveF)} in ${esc(W.spec.label)}</span>` : ''}
            <span class="tag ${W.narrowed?'':'accent'} num">${fmt(totF)} friction</span>
          </div>
          ${chev}
        </summary>
        <div class="sr-body">
          <div class="sr-cols">
            <div class="sr-col">
              <h4>Proposed SKILL.md edits (${edits.length})</h4>
              ${edits.length ? `<ul>${edits.map(e => `<li>${fmtCopy(e)}</li>`).join('')}</ul>` : '<div style="font-size:13px;color:var(--soft)">No edits proposed.</div>'}
            </div>
            <div class="sr-col issues">
              <h4>Evidenced issues (${issues.length})</h4>
              ${issues.length ? `<ul>${issues.map(i => `<li>${fmtCopy(i)}</li>`).join('')}</ul>` : '<div style="font-size:13px;color:var(--soft)">No issues listed.</div>'}
            </div>
          </div>
          ${(s.sessions||[]).length ? `<div class="sess-links" style="margin-top:14px"><span>Sessions:</span>${s.sessions.slice(0,8).map(x => `<a class="${W.narrowed && W.idSet.has(x)?'in-win':''}" onclick="openConv('${esc(x)}')">${esc(String(x).slice(0,8))}</a>`).join('')}${s.sessions.length > 8 ? `<span>+${s.sessions.length-8} more</span>` : ''}</div>` : ''}
        </div>
      </details>`;
    }).join('')}</div>` : '<div class="empty">No matching skill friction items in this period.</div>'}` : '';

  const rulesHtml = (!skillSec || skillSec === 'rules') ? `
    <div class="sec-head"><h2>AGENTS.md rule candidates</h2><span class="meta">${rules.length} quote-backed rules</span></div>

      const iw = countInWin(r.sessions);
      return `<div class="entry ${W.narrowed && iw===0?'dimmed':''}">
        <div class="entry-top"><span class="entry-name">${fmtCopy(r.rule)}</span>${W.narrowed && iw?`<span class="tag accent num">${iw} in ${esc(W.spec.label)}</span>`:''}</div>
        ${renderQuotes((r.evidence_quotes||[]).slice(0,3))}
        ${(r.sessions||[]).length ? `<div class="sess-links">${r.sessions.slice(0,5).map(x => `<a class="${W.narrowed && W.idSet.has(x)?'in-win':''}" onclick="openConv('${esc(x)}')">${esc(String(x).slice(0,8))}</a>`).join('')}</div>` : ''}
      </div>`;
    }).join('')}</div>` : '<div class="empty">No rule candidates recorded.</div>'}` : '';

  const newHtml = (!skillSec || skillSec === 'new') ? `
    <div class="grid2" style="margin-top:12px">
      <div>
        <div class="sec-head"><h2>New skills to build</h2><span class="meta">${ns.length}</span></div>
        ${ns.length ? ns.map(s => `<div class="entry">
          <div class="entry-name">${fmtCopy(s.name)}</div>
          <div class="entry-issues">${fmtCopy(s.problem)}</div>
          ${s.sketch ? `<div style="font-size:13.5px;color:var(--ink);line-height:1.55">${fmtCopy(s.sketch)}</div>` : ''}
          ${(s.recurring_in||[]).length ? `<div class="sess-links">${s.recurring_in.slice(0,6).map(x => `<a class="${W.narrowed && W.idSet.has(x)?'in-win':''}" onclick="openConv('${esc(x)}')">${esc(String(x).slice(0,8))}</a>`).join('')}</div>` : ''}
        </div>`).join('') : '<div class="empty">None proposed.</div>'}
      </div>
      <div>
        <div class="sec-head"><h2>Scheduled cron candidates</h2><span class="meta">${nc.length}</span></div>
        ${nc.length ? nc.map(s => `<div class="entry">
          <div class="entry-top"><span class="entry-name">${fmtCopy(s.name)}</span>${s.cadence ? `<span class="tag">${esc(s.cadence)}</span>` : ''}</div>
          <div style="font-size:13.5px;color:var(--ink);margin-top:4px;line-height:1.55">${fmtCopy(s.what)}</div>
          ${(s.sessions||[]).length ? `<div class="sess-links">${s.sessions.slice(0,6).map(x => `<a class="${W.narrowed && W.idSet.has(x)?'in-win':''}" onclick="openConv('${esc(x)}')">${esc(String(x).slice(0,8))}</a>`).join('')}</div>` : ''}
        </div>`).join('') : '<div class="empty">None proposed.</div>'}
      </div>
    </div>` : '';

  return banner + secPills + backlogHtml + rulesHtml + newHtml;
}

function viewConversations(){
  const pool = W.convs;
  const doms = [...new Set(pool.map(c => c.vault_domain))].filter(Boolean).sort();
  const types = [...new Set(pool.map(c => c.task_type))].filter(Boolean).sort();
  const hars = [...new Set(pool.map(c => c.harness))].filter(Boolean).sort();
  const kinds = [...new Set(pool.map(c => c.source_kind))].filter(Boolean).sort();
  const rows = pool.filter(c => {
    if(cf.dom && c.vault_domain !== cf.dom) return false;
    if(cf.type && c.task_type !== cf.type) return false;
    if(cf.har && c.harness !== cf.har) return false;
    if(cf.kind && c.source_kind !== cf.kind) return false;
    if(cf.q){
      const s = ((c.title||'') + ' ' + (c.intent||'') + ' ' + (c.first_message||'') + ' ' + (c.project||'') + ' ' + (c.skills_invoked||[]).join(' ')).toLowerCase();
      if(!s.includes(cf.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(cf.page >= totalPages) cf.page = 0;
  const slice = rows.slice(cf.page * PAGE_SIZE, (cf.page + 1) * PAGE_SIZE);
  const hasFilter = Boolean(cf.q || cf.dom || cf.type || cf.har || cf.kind);
  const ctrl = `<div class="controls">
    <input type="search" placeholder="Search title, intent, project or skill..." value="${esc(cf.q)}" oninput="cf.q=this.value;cf.page=0;rerender()">
    <select onchange="cf.har=this.value;cf.page=0;rerender()"><option value="">All harnesses</option>${hars.map(h=>`<option ${cf.har===h?'selected':''}>${esc(h)}</option>`).join('')}</select>
    <select onchange="cf.kind=this.value;cf.page=0;rerender()"><option value="">All sources</option>${kinds.map(k=>`<option ${cf.kind===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
    <select onchange="cf.dom=this.value;cf.page=0;rerender()"><option value="">All domains</option>${doms.map(d=>`<option ${cf.dom===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <select onchange="cf.type=this.value;cf.page=0;rerender()"><option value="">All types</option>${types.map(t=>`<option ${cf.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <span style="font-family:var(--font-mono);font-size:12px;color:var(--soft)">${fmt(rows.length)} of ${fmt(pool.length)}</span>
    ${hasFilter ? '<button type="button" class="clear-btn" onclick="cf={q:\'\',dom:\'\',type:\'\',har:\'\',kind:\'\',page:0};rerender()">Clear filters</button>' : ''}
  </div>`;
  const body = slice.map(c => `<tr class="click" onclick="openConv('${esc(c.session_id)}')">
    <td class="num" style="font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap">${esc(c.date)}</td>
    <td><span class="tag kind">${esc(c.harness||'unknown')}</span></td>
    <td><span class="tag">${esc(c.vault_domain)}</span></td>
    <td>${esc(c.task_type)}</td>
    <td style="font-weight:500;color:var(--ink-strong)">${esc(c.title)}</td>
    <td class="num" style="text-align:right;font-family:var(--font-mono)">${(c.friction||[]).length || '&ndash;'}</td>
    <td class="num" style="text-align:right;font-family:var(--font-mono)">${(c.automation_candidates||[]).length || '&ndash;'}</td>
    <td style="color:var(--muted)">${esc((c.outcome||{}).status || c.vault_status || '')}</td>
  </tr>`).join('');
  const pager = `<div class="pager">
    <span class="num">Showing ${rows.length ? fmt(cf.page*PAGE_SIZE + 1) : 0}&ndash;${fmt(Math.min((cf.page+1)*PAGE_SIZE, rows.length))} of ${fmt(rows.length)}</span>
    <div class="pager-btns">
      <button type="button" ${cf.page<=0?'disabled':''} onclick="cf.page--;rerender()">&larr; Prev</button>
      <span class="num" style="font-family:var(--font-mono);font-size:12px">Page ${cf.page+1} / ${totalPages}</span>
      <button type="button" ${cf.page>=totalPages-1?'disabled':''} onclick="cf.page++;rerender()">Next &rarr;</button>
    </div>
  </div>`;
  return ctrl + `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Harness</th><th>Domain</th><th>Type</th><th>Title</th><th style="text-align:right">Fric</th><th style="text-align:right">Auto</th><th>Outcome</th></tr></thead><tbody>${body || '<tr><td colspan="8" class="empty">No matching sessions in this period. Clear a filter or widen the time window above.</td></tr>'}</tbody></table></div>` + pager;
}

function viewObservations(){
  const pool = W.obs;
  const types = ['friction','toil','preference','automation'];
  const rows = pool.filter(o => {
    if(ot && o.type !== ot) return false;
    if(oq){
      const s = ((o.text||'') + ' ' + (o.evidence||'') + ' ' + (o.harness||'')).toLowerCase();
      if(!s.includes(oq.toLowerCase())) return false;
    }
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(opage >= totalPages) opage = 0;
  const slice = rows.slice(opage * PAGE_SIZE, (opage + 1) * PAGE_SIZE);
  const ctrl = `<div class="controls">
    <button type="button" class="pill ${ot===''?'on':''}" aria-pressed="${ot===''}" onclick="ot='';opage=0;rerender()">All ${fmt(pool.length)}</button>
    ${types.map(t => `<button type="button" class="pill ${ot===t?'on':''}" aria-pressed="${ot===t}" onclick="ot='${t}';opage=0;rerender()">${t} ${fmt(pool.filter(o=>o.type===t).length)}</button>`).join('')}
    <input type="search" placeholder="Filter observation or verbatim quote..." value="${esc(oq)}" oninput="oq=this.value;opage=0;rerender()">
    ${(ot || oq) ? '<button type="button" class="clear-btn" onclick="ot=\'\';oq=\'\';opage=0;rerender()">Clear filters</button>' : ''}
  </div>`;
  const body = slice.map(o => `<tr class="click" onclick="openConv('${esc(o.session_id)}')">
    <td style="white-space:nowrap"><span class="tag ${o.type==='friction'?'accent':o.type==='automation'?'kind':''}">${esc(o.type)}</span>${o.subtype?`<span class="tag">${esc(o.subtype)}</span>`:''}</td>
    <td>${esc(o.text)}</td>
    <td style="font-family:var(--font-serif);font-style:italic;color:var(--muted)">&ldquo;${esc(o.evidence)}&rdquo;${uv(o)}</td>
    <td class="num" style="font-family:var(--font-mono);font-size:12px;color:var(--soft);white-space:nowrap">${esc(o.date)}</td>
  </tr>`).join('');
  const pager = `<div class="pager">
    <span class="num">Showing ${rows.length ? fmt(opage*PAGE_SIZE + 1) : 0}&ndash;${fmt(Math.min((opage+1)*PAGE_SIZE, rows.length))} of ${fmt(rows.length)}</span>
    <div class="pager-btns">
      <button type="button" ${opage<=0?'disabled':''} onclick="opage--;rerender()">&larr; Prev</button>
      <span class="num" style="font-family:var(--font-mono);font-size:12px">Page ${opage+1} / ${totalPages}</span>
      <button type="button" ${opage>=totalPages-1?'disabled':''} onclick="opage++;rerender()">Next &rarr;</button>
    </div>
  </div>`;
  return ctrl + `<div class="table-wrap"><table><thead><tr><th>Type</th><th>Observation</th><th>Evidence (verbatim)</th><th>Date</th></tr></thead><tbody>${body || '<tr><td colspan="4" class="empty">No observations match this filter in the selected period.</td></tr>'}</tbody></table></div>` + pager;
}

function copyText(txt, btn){
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  const old = btn.textContent;
  btn.textContent = 'Copied';
  setTimeout(() => { btn.textContent = old; }, 1200);
}
