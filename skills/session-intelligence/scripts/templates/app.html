  const ac = (c.automation_candidates||[]).map(a => `<div class="drow"><strong>${esc(a.title)}</strong> <span class="tag kind">${esc(a.kind)}</span>${a.target?`<span class="tag">${esc(a.target)}</span>`:''}${a.payoff?`<span class="tag gold">payoff ${esc(a.payoff)}</span>`:''}${a.rationale?`<div style="margin:6px 0;font-size:13.5px;color:var(--muted)">${esc(a.rationale)}</div>`:''}<blockquote class="quote">&ldquo;${esc(a.evidence)}&rdquo;${uv(a)}</blockquote></div>`).join('');
  const toil = (c.toil||[]).map(t => `<div class="drow">${esc(t.desc)}${t.frequency_hint?` <span class="tag">${esc(t.frequency_hint)}</span>`:''}<blockquote class="quote">&ldquo;${esc(t.evidence)}&rdquo;${uv(t)}</blockquote></div>`).join('');
  const pref = (c.preferences||[]).map(p => `<div class="drow"><strong>${esc(p.rule)}</strong><blockquote class="quote">&ldquo;${esc(p.quote)}&rdquo;${uv(p)}</blockquote></div>`).join('');
  const hl = (c.highlights||[]).map(q => `<blockquote class="quote">&ldquo;${esc(q)}&rdquo;</blockquote>`).join('');
  const o = c.outcome || {};
  const resume = c.resume_cmd || (c.harness === 'claude-code' ? `claude --resume ${c.session_id}` : c.source_path || c.session_id);
  document.getElementById('drawer').innerHTML = `
    <button class="drawer-close" type="button" aria-label="Close panel" onclick="closeDrawer()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <h2>${esc(c.title)}</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:8px">
      <span style="font-family:var(--font-mono)">${esc(c.date)}</span> &middot;
      <span class="tag kind">${esc(c.harness||'unknown')}</span>${c.host?`<span class="tag">${esc(c.host)}</span>`:''}
      <span class="tag">${esc(c.vault_domain)}</span> ${esc(c.task_type)} &middot;
      <span class="num">${c.human_turns||'?'} turns</span> &middot; <span class="num">${c.correction_hits||0} corrections</span>
    </div>
    ${sec('Intent', `<p style="margin:0;line-height:1.6">${esc(c.intent)}</p>`)}
    ${sec('Outcome', `<span class="tag">${esc(o.status||c.vault_status||'')}</span> ${o.committed?'<span class="tag gold">committed</span>':''}<p style="margin:8px 0 0;line-height:1.55">${esc(o.summary)}</p>${(o.artifacts||[]).length?`<div style="margin-top:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--soft)">${o.artifacts.map(esc).join('<br>')}</div>`:''}`)}
    ${sec('Skills', (c.skills_invoked||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join('') + (c.skills_missing||[]).map(s=>`<span class="tag accent">missing: ${esc(s)}</span>`).join(''))}
    ${sec('Automation candidates (' + (c.automation_candidates||[]).length + ')', ac)}
    ${sec('Friction (' + (c.friction||[]).length + ')', fr)}
    ${sec('Toil', toil)}
    ${sec('Preferences', pref)}
    ${sec('Notable quotes', hl)}
    <div class="dsec" style="font-size:12px;color:var(--soft)">
      <div>Session ID: <code>${esc(c.session_id)}</code></div>
      <div style="margin-top:8px">Resume / open: <code>${esc(resume)}</code><button class="copy-btn" type="button" onclick="copyText(${JSON.stringify(resume)}, this)">Copy</button></div>
      ${c.vault_note ? `<div style="margin-top:8px">Vault note: <code>${esc(c.vault_note)}</code></div>` : ''}
    </div>`;
  document.getElementById('dbg').classList.add('on');
}
function closeDrawer(){ document.getElementById('dbg').classList.remove('on'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });

function drawCharts(){
  document.querySelectorAll('.chart-slot[data-chart]').forEach(slot => {
    const k = slot.getAttribute('data-chart');
    if(k === 'cadence') renderCadenceSvg(slot);
    else if(k === 'harnesses') renderHarnessSvg(slot);
    else if(k === 'tasks') renderTaskDotSvg(slot);
    else if(k === 'matrix') renderMatrixSvg(slot);
  });
}

let resizeTimer = null;
if(typeof ResizeObserver !== 'undefined'){
  const ro = new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawCharts, 40);
  });
  ro.observe(document.getElementById('main'));
} else {
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 60); });
}

function render(){
  updateChrome();
  buildTabs();
  document.getElementById('main').innerHTML =
    tab === 'Overview' ? viewOverview() :
    tab === 'Roadmap' ? viewRoadmap() :
    tab === 'Skills' ? viewSkills() :
    tab === 'Conversations' ? viewConversations() : viewObservations();
  drawCharts();
}
function rerender(){
  const active = document.activeElement;
  const selStart = active && active.tagName === 'INPUT' ? active.selectionStart : null;
  document.getElementById('main').innerHTML = tab === 'Conversations' ? viewConversations() : viewObservations();
  if(selStart != null){
    const inp = document.querySelector('#main input[type="search"]');
    if(inp){ inp.focus(); inp.setSelectionRange(selStart, selStart); }
  }
}
render();
</script>
</body>
</html>
