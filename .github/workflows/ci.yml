name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - run: python3 scripts/check_binary_ratchet.py
      - run: python3 scripts/check_code_comments.py --ratchet
      - run: SHOT_OUT=/tmp/validate-public-skills bash ./.agents/skills/verify-public-skills/scripts/validate-all
      - run: python3 -m unittest discover -s skills/hygiene/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/editorial-review/scripts/tests
      - run: python3 -m unittest discover -s skills/orchestrator/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/cmux/scripts -p 'test*.py'
